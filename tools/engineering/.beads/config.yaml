# Task state is edited through bd; project rules remain in docs/development.
issue-prefix: gl
dolt:
    auto-push: false
backup:
    enabled: false
export:
    auto: true
    path: issues.jsonl
    interval: 1ms
    git-add: false
import:
    path: issues.jsonl
# No sync.remote until a shared Dolt remote is explicitly published.
# Fresh clones use bd bootstrap to import the tracked task projection.
