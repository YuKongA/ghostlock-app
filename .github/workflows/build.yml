name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  ONDK_VERSION: "r30.1"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Decode Android signing key
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: echo ${{ secrets.SIGNING_KEY }} | base64 -d > keystore.jks

      - name: Build Release APK
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          export KEYSTORE_PATH="../keystore.jks"
          export KEYSTORE_PASS="${{ secrets.KEY_STORE_PASSWORD }}"
          export KEY_ALIAS="${{ secrets.ALIAS }}"
          export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename Release APK
        run: mv build/app/outputs/apk/release/*.apk GhostLock-release.apk

      - name: Export kernel profiles (GLK1)
        run: ./gradlew exportProfiles --no-daemon

      - name: Package kernel profiles
        run: |
          cd build/profiles
          zip -r "$GITHUB_WORKSPACE/GhostLock-profiles.zip" .
          unzip -l "$GITHUB_WORKSPACE/GhostLock-profiles.zip" | tail -5

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-release
          path: GhostLock-release.apk
          archive: false

      - name: Upload kernel profiles
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-profiles
          path: GhostLock-profiles.zip
          archive: false

  prerelease:
    name: Pre-release
    needs: [build-apk]
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          skip-decompress: true

      - name: Prepare release files and notes
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          cd release-files
          for f in GhostLock-release.apk GhostLock-profiles.zip; do
            if [ -f "$f" ]; then
              sha256sum "$f"
            fi
          done > sha256sum.txt
          cd ..

          VERSION_NAME=$(sed -nE 's/^[[:space:]]*val appVersionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          SHORT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)

          export VERSION_NAME
          export SHORT_HASH
          export COMMIT_COUNT
          export COMMIT_MSG

          python3 - <<'PY'
          import os

          version = os.environ.get("VERSION_NAME", "Unknown")
          short_hash = os.environ.get("SHORT_HASH", "Unknown")
          commit_count = os.environ.get("COMMIT_COUNT", "0")
          commit_msg = os.environ.get("COMMIT_MSG", "No commit message").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "YuKongA/ghostlock-app")
          sha = os.environ.get("GITHUB_SHA", "")

          with open("release-files/sha256sum.txt", "r", encoding="utf-8") as f:
              checksums = f.read().strip()

          lines = [
              "### GhostLock Pre-release",
              "",
              f"- **Version**: `v{version}` (`{commit_count}`)",
              f"- **Commit**: [`{short_hash}`](https://github.com/{repo}/commit/{sha})",
              "",
              "#### Commit Message",
              "```",
              commit_msg,
              "```",
              "",
              "#### Files",
              "- `GhostLock-release.apk`: GhostLock Android Application",
              "- `GhostLock-profiles.zip`: Bundled kernel profiles (HOCON)",
              "",
              "#### SHA256 Checksums",
              "```",
              checksums,
              "```",
          ]
          notes = "\n".join(lines) + "\n"

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          PY

      - name: Update Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f pre-release
          git push -f origin pre-release
          gh release edit pre-release --target ${{ github.sha }} 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          target_commitish: ${{ github.sha }}
          name: GhostLock Pre-release
          body_path: release-notes.md
          prerelease: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post_telegram:
    needs: [build-apk]
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          skip-decompress: true

      - name: Post to Telegram
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_API_LINK: ${{ secrets.BOT_API_LINK }}
        run: bash .github/scripts/post_telegram.sh
