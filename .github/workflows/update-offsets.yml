name: Update offsets.json

on:
  push:
    branches: [main]
    paths:
      - 'src/kernels/**'
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: regenerate offsets.json
        run: python3 tools/gen_offsets_json.py
      - name: commit refreshed offsets.json
        run: |
          if ! git diff --quiet -- offsets.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add offsets.json
            git commit -m 'offsets: regenerate offsets.json from kernel headers'
            git push
          else
            echo 'offsets.json unchanged'
          fi
