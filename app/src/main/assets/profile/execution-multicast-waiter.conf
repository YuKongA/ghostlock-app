# GhostLock profile fragment (HOCON, canonical R3 owner-qualified layout).
#
# Multicast-waiter route tuning preset. The controller and the Gradle exporter
# look this file up by route token: execution-<route>.conf, where underscores in
# the token become dashes in the file name (route token "multicast_waiter" ->
# file execution-multicast-waiter.conf). The
# fragment is merged as
#   backend.cve_2026_43499.execution.routes.multicast_waiter.*
# and consumed by ProfileMerger.fillRouteExecutionDefaults (missing keys only).
#
# Value provenance (repository rule: every number names its source) - the three
# values are the legacy route constants, verbatim:
#   kMulticastMaxAttempts = 128 | kMulticastArmSequence = 16 | kMulticastArmHold = 20000
# Source: core/src/backend/cve_2026_43499/route/multicast_waiter_route.cpp:34-36
#   (tag legacy/baseline-20261008). The comment above those constants (:32) records
#   the old profile surface as route.multicast_waiter {attempts, arm_sequence,
#   arm_hold}, where 0 meant "keep the compiled default".
#
# Key naming: the key is spelled exactly as the wire/manifest field
#   (profile-manifest-v3.tsv: backend.cve_2026_43499.route.multicast_waiter.arm_hold),
# so preset key == wire field, 1:1, no renaming. Repository rule: legacy keys are
# never renamed (the old route constant is kMulticastArmHold; the tcp precedent
# keeps post_receive_hold_iterations).
backend {
  cve_2026_43499 {
    execution {
      routes {
        multicast_waiter {
          attempts = 128
          arm_sequence = 16
          arm_hold = 20000
        }
      }
    }
  }
}
