# general profile：按 KMI 家族兜底（内核未精确匹配到本机 release 时使用）
# 标签来源：lkm-kmi-manifest.tsv（<label>）—— 文件名与内部 release 均由该标签派生，勿手改
# available 声明：仅声明已在真机实测的后端/路径；43499 未实测前保持注释
# 注意：本文件是兜底配置，精确匹配的 <uname-r>.conf 优先
# GhostLock general profile for android15-6.6 (batch 2).
# label and family come from lkm-kmi-manifest.tsv (never hand-copied).
# The 43499 skeleton below is the unmeasured null skeleton inlined from 6.6-template.conf;
# its release/available lines are deliberately NOT inlined (include would merge them back).
ghostlock {
  schema_version = 3
  release = "6.6-android15-general"
  available {
    cve_2026_43284 { queue = [ { step = "pagecache_write" } ] }
    # cve_2026_43499 { route = "multicast_waiter" }   # commented per user instruction: general does not declare 43499 usable
  }
  kernel_major = 6
  kernel_minor = 6
  backend {
    cve_2026_43499 {
      abi {
        task_struct {
          prio = null
          normal_prio = null
          sched_task_group = null
          pi_lock = null
          pi_waiters = null
          pi_top_task = null
          pi_blocked_on = null
          pid = null
          tgid = null
          atomic_flags = null
          real_cred = null
          cred = null
          comm = null
          tasks = null
          seccomp = null
        }
        cred {
          caps_offset = null
        }
        offset {
          init_task = null
          init_cred = null
          root_task_group = null
          selinux_enforcing = null
          selinux_blob_sizes = null
          security_hook_heads = null
        }
        kernel {
          kernel_phys_load = null
          kernel_phys_offset = null
        }
      }
      route {
        tcp_zerocopy {}
        select_stack {
          waiter_shift = null
        }
      }
      kernel {
        kernelsnitch_collisions = null
        compact_waiter = null
      }
      cred {
        copy_size = null
        usage_value = null
        caps_count = null
        caps_value = null
      }
      offset {
        slide_nfulnl_logger = null
        slide_boot_id = null
        slide_loggers_0_1 = null
      }
    }
  }
}
