# GhostLock kernel profile: 6.1.157-android14-11-ga8b0b542991e-ab15601211 (HOCON).
release = "6.1.157-android14-11-ga8b0b542991e-ab15601211"
include "common/abi/6.1.157-android14-11-ga8b0b542991e-ab15601211.conf"
schema_version = 1
kernel_major = 6
recommend_shizuku = 0
# MediaTek MT6788 (Infinix X6879 / X6873 family) physical mapping, measured on
# device rather than derived from the _text VA:
#   linear-map DRAM base (PHYS_OFFSET) = 0x40000000  (33/33 kernel OOPS)
#   _text physical load               = 0x40000000  (DRAM-base mapping,
#                                                     text_offset 0)
# Only the difference reaches the translation, so delta = 0 and the direct-map
# alias of an image offset is PAGE_OFFSET + offset. Confirmed at runtime: the
# SELinux write resolved to 0xffffff800225b820 and the credential install
# resolved init_cred to 0xffffff8002031aa8 (getuid() -> 0).
kernel_phys_load = 1073741824
kernel_phys_offset = 1073741824
route = [
  { tcp_zerocopy {
    compact_waiter = 1
  } }
  { select_stack {
      waiter_shift = 1
    } }
]

offset {
  empty_zero_page = null
  init_task = 33683008
  init_cred = 33757864
  root_task_group = 35690880
  selinux_enforcing = 36026400
  selinux_blob_sizes = 22882632
  security_hook_heads = 22880824
