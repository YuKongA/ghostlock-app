# GhostLock: kernel builds that already contain the CVE-2026-43499 fix.
#
# These releases have nothing to gain from a kernel profile: the rtmutex
# use-after-free the exploit needs (remove_waiter() operating on `current`
# instead of `waiter::task`) is not present, so the extractor refuses them with
# exit code 6 and the attack has no primitive to build on. The app reports them
# as patched instead of "not supported" so nobody hunts for offsets that cannot
# help.
#
# Keep entries short and factual. `why` is shown in the app; the evidence lives
# in docs/kernel_profiles/PATCHED_KERNELS.md.
schema_version = 1
patched = [
  {
    release = "6.6.118-android15-8-gf72a02f47f4b-abogki551678766-4k"
    vendor = "Xiaomi"
    devices = "Xiaomi 15 (dada), HyperOS 4.0.3.0 / 4.0.4.0"
    upstream_fix = "3bfdc63936dd (6.6.140)"
    why = "remove_waiter() locks waiter::task, not current: the rtmutex fix is backported, the exploit primitive is gone"
  }
]
