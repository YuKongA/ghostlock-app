# GhostLock execution tuning for the multicast_waiter route (HOCON); include it
# only from profiles whose route (or fallback) is multicast_waiter.
execution {
  routes {
    multicast_waiter {
      ready_timeout_ms = 10000
      post_requeue_settle_us = 200000
      post_adjust_settle_us = 100000
    }
  }
}
