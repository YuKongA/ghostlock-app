# GhostLock execution tuning (HOCON): advisory wait/retry parameters,
# identical for every kernel; include it and override only the differences.
# Route-specific tuning lives in execution-<route>.conf and is included
# only by the profiles that use (or fall back to) that route.
execution {
  recommended_cpus {
    main = 0
    consumer = 1
  }
  heap {
    prepare_max_attempts = 4
    prepare_timeout_ms = 240000
    kernelsnitch_timeout_ms = 60000
  }
  race {
    route_wait_ms = 1000
    setup_settle_us = 50000
    state_poll_interval_us = 1000
  }
  stages {
    w1_attempts = 15
    w1_settle_us = 100000
    w1_scratch_repair_attempts = 3
    w2_attempts = 15
    w2_settle_us = 100000
    w3_chain_rounds = 3
    w3_attempts = 6
    w3_settle_us = 50000
  }
  handoff {
    pre_dispatch_settle_ms = 2000
    module_poll_attempts = 30
    module_poll_interval_ms = 100
    enforce_poll_attempts = 200
    enforce_poll_interval_ms = 100
  }
}
