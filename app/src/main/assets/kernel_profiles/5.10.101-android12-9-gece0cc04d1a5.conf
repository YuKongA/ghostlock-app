# LSPrivilege kernel profile: Black Shark 5 Pro KTUS-A0 (katyusha), SM8450.
# Kernel 5.10.101-android12-9-gece0cc04d1a5, bootloader unlocked, SELinux
# enforcing, panic_on_oops=1.
#
# Shallow-frame 5.10 generation: the IPv4 msfilter copy window cannot reach
# the stale rt_mutex waiter (kernel copies at most 0x108 bytes at stack depth
# 864; the waiter needs 480), so multicast uses stamp_delivery = 1: the same
# encoded stamp is delivered through rt_sigreturn's fpsimd restore, whose
# 528-byte kernel stack buffer at depth 768 covers waiter_off = 320 with
# task/lock at stamp offsets 368/376 = vregs[23]. waiter geometry was
# kprobe-measured on-device (stale waiter at race-frame depth 448).
#
# offset.* are offsets from _text (0xffffffc008000000), taken from this
# device's own /proc/kallsyms dump and byte-checked against the stock boot.img.
# Struct offsets derived from the matching kernel source and confirmed
# on-device: W1 landed, W2 reached uid=0, multicast_waiter route clean.
release = "5.10.101-android12-9-gece0cc04d1a5"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
kernel_phys_load = 2818572288      # 0xA8000000
kernel_phys_offset = 2147483648    # DRAM base 0x80000000
route {
  multicast_waiter {
    waiter_off = 320               # stale waiter base inside the fpsimd window
    buffer_size = 528              # user_fpsimd_state: vregs[32] + fpsr + fpcr
    task_offset = 48               # waiter->task   @ +0x30
    lock_offset = 56               # waiter->lock   @ +0x38
    stamp_delivery = 1             # rt_sigreturn fpsimd restore delivery
    compact_waiter = 1
  }
}
fallback {
  to = "none"
}
execution {
  # cpu5/6/7 (big/prime cores) get thermally isolated under sustained load
  # (measured on-device: pin EINVAL rates cpu5 57%, cpu6 28%, cpu7 99.6%);
  # the little cluster stays fully active. Pin main/consumer inside it.
  # selected_cpus is the fixed-pair authoring slot: recommended_cpus would
  # lose the merge against execution-tuning.conf's 0/1 default.
  selected_cpus {
    main = 2
    consumer = 3
  }
  routes {
    multicast_waiter {
      consumer_max_calls = 16
      consumer_burst_calls = 1
    }
  }
}
kernelsnitch {
  collisions = 8
  mm_struct_sz = 960               # kprobe-measured stride on this kernel
}
task_struct {
  prio = 132                       # 0x084
  normal_prio = 140                # 0x08c
  sched_task_group = 784           # 0x310
  pi_lock = 2156                   # 0x86c
  pi_waiters = 2176                # 0x880
  pi_top_task = 2192               # 0x890
  pi_blocked_on = 2200             # 0x898
  pid = 1480                       # 0x5c8
  tgid = 1484                      # 0x5cc
  atomic_flags = 1424              # 0x590
  real_cred = 1912                 # 0x778
  cred = 1920                      # 0x780
  comm = 1936                      # 0x790
  tasks = 1224                     # 0x4c8
  seccomp = 2120                   # 0x848
}
cred {
  copy_size = 168                  # sizeof(struct cred), arm64 5.10
  usage_offset = 0
  usage_value = 256
  caps_offset = 48                 # cap_inheritable @ 48, 3 x 8B up to 72
  caps_count = 3
  caps_value = 2199023255551       # 0x1ffffffffff
  ref_count = 3                    # user / user_ns / group_info (security stays NULL)
  ref0_offset = 128                # ->user       = root_user
  ref0_image = -274565697040
  ref1_offset = 136                # ->user_ns    = init_user_ns
  ref1_image = -274565696888
  ref2_offset = 144                # ->group_info = init_groups
  ref2_image = -274565691624
  ref3_offset = null
  ref3_image = null
}
offset {
  init_task = 43695616
  init_cred = 43779696
  empty_zero_page = 45727744
  root_task_group = 45752320
  selinux_enforcing = 46471968     # selinux_state.enforcing (W1 writes 0)
  selinux_blob_sizes = 38551816
