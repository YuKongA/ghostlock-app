# GhostLock 内核配置模板（HOCON）：6.1
# 用途：复制后逐项填写；调试页“加载其他内置配置”可手动加载查看字段结构。
# 步骤：
#   1. 按设备 `uname -r` 替换 release，并把文件重命名为 <release>.conf；
#   2. 填写所有 null（几何/偏移/路由），删除未采用的路由分支，并按所选路由
#      include "execution-<route>.conf"（tcp 回退 select 时两者都要）；
#   3. 在 index.conf 的 profiles 数组登记 { release = ..., file = ... }。
# 共享值（execution 调优、6.x 凭据模板等）由 include 引入，不必复制。

include "execution-tuning.conf"
# 与设备 uname -r 完全一致（区分大小写与后缀）；发布前替换本模板名
release = "6.1-template"
# 配置 schema 版本，固定为 1
schema_version = 1
# 内核主版本（5 或 6），用于地址解析与合法性检查
kernel_major = 6
# 该内核是否建议走 Shizuku 路径（0/1，默认 0，仅提示不强制）
recommend_shizuku = null
# 显式路由父项：只保留实际采用的一个分支，删除其余分支块
route {
  # tcp zerocopy 路由
  tcp_zerocopy {
    # tcp 路由的紧凑 waiter 布局标记（0/1）
    compact_waiter = null
  }
  # select() 等待栈路由
  select_stack {
    # waiter 在栈上的相对位移（0 合法，负值常见）
    waiter_shift = null
  }
}
# 回退声明：tcp 路由失败后回退 select_stack；不使用回退时删除整块
fallback {
  # 回退目标路由名，或 "none" 关闭回退
  to = null
  # 回退执行所需字段（仅声明回退时填写）
  route {
    select_stack {
      # 回退 select 路由的 waiter 位移（0 合法）
      waiter_shift = null
    }
  }
}
# KernelSnitch 参数（mm_struct 泄漏搜索，所有路由通用）
kernelsnitch {
  # KernelSnitch 需要的 futex 碰撞数量
  collisions = null
}
# 任务结构字段偏移（相对 task_struct 起始）
task_struct {
  # 任务优先级（PI 提升判定）
  prio = null
  # 任务常规优先级
  normal_prio = null
  # sched_task_group 偏移
  sched_task_group = null
  # pi_lock 自旋锁偏移
  pi_lock = null
  # pi_waiters 链表偏移
  pi_waiters = null
  # pi_top_task 偏移
  pi_top_task = null
  # pi_blocked_on 偏移
  pi_blocked_on = null
  # PID 偏移
  pid = null
  # TGID 偏移
  tgid = null
  # atomic_flags（现场清理判定）
  atomic_flags = null
  # real_cred 指针偏移
  real_cred = null
  # cred 指针偏移
  cred = null
  # comm 偏移
  comm = null
  # 任务链表 tasks 偏移
  tasks = null
  # seccomp 偏移
  seccomp = null
}
# 凭据模板（cred 结构拷贝与引用修复）
cred {
  # capability 集合偏移
  caps_offset = null
  # 凭据结构整体拷贝大小
  copy_size = null
  # 引用计数目标值
  usage_value = null
  # capability 数量
  caps_count = null
  # capability 填充值
  caps_value = null
}
# 内核符号偏移（相对内核镜像基址）
offset {
  # init_task 相对内核镜像基址的偏移
  init_task = null
  # init_cred 偏移
  init_cred = null
  # root_task_group 偏移
  root_task_group = null
  # selinux_state.enforcing 偏移（W1 写 0）
  selinux_enforcing = null
  # selinux_blob_sizes 偏移
  selinux_blob_sizes = null
  # security_hook_heads 偏移
  security_hook_heads = null
  # KASLR 滑移定位锚点：nfulnl_logger
  slide_nfulnl_logger = null
  # KASLR 滑移定位锚点：boot_id
  slide_boot_id = null
  # KASLR 滑移定位锚点：loggers[0..1]
  slide_loggers_0_1 = null
}
