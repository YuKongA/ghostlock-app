# GhostLock kernel profile: 6.1.145-android14-11-maybe-dirty (vivo V2324A / MT6989, Android 16)
# Offsets measured from this device's own kallsyms (R15 line, full-chain verified
# on 2026-10-08: W1 -> vr.ko -> W2 -> W3 -> root -> KernelSU).
# NOTE: this release string is shared by several vivo devices (iQOO 12, Pad 5,
# Neo9 Pro, X100 Pro); see the PR description. Route: multicast_waiter is the
# one that worked here (pselect/select_stack is unreachable on this build).
include "credential-6x.conf"
include "kernelsnitch-6x.conf"

release = "6.1.145-android14-11-maybe-dirty"
schema_version = 1
kernel_major = 6
recommend_shizuku = 0
kernel_phys_load = 2147483648
kernel_phys_offset = 2147483648

route {
  multicast_waiter {
    waiter_off = 96
    buffer_size = 264
  }
}
fallback { to = "none" }

kernelsnitch {
  mm_struct_sz = 1024
}

execution {
  recommended_cpus {
    main = 0
    consumer = 1
  }
}

task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 840
  pi_lock = 2340
  pi_waiters = 2360
  pi_top_task = 2376
  pi_blocked_on = 2384
  pid = 1584
  tgid = 1588
  atomic_flags = 1520
  real_cred = 2096
  cred = 2104
  comm = 2120
  tasks = 1360
  seccomp = 2304
}

offset {
  init_task = 34667328
  init_cred = 34743344
  root_task_group = 37005120
  selinux_enforcing = 38271896
  selinux_blob_sizes = 23278560
  security_hook_heads = 23276752
  slide_nfulnl_logger = 34615040
  slide_loggers_0_1 = 36523560
  slide_boot_id = 36136976
}
