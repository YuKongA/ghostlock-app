# GhostLock kernel profile: 6.1.145-android14-11-maybe-dirty (HOCON).
# vivo X Fold5 (V2436A / PD2436), OriginOS 6 / Android 16, SM8650.
# Firmware PD2436E_A_16.1.17.12.W10.V000L1, security patch 2026-07-01.
# Offsets derived from this firmware's boot.img / xbl_config.img / uefi.img and
# validated on hardware: multicast_waiter reached uid 0, loaded KernelSU and
# restored enforcing.  Do not reuse across OTAs.
include "credential-6x.conf"
include "kernelsnitch-6x.conf"
release = "6.1.145-android14-11-maybe-dirty"
schema_version = 1
kernel_major = 6
recommend_shizuku = 0
recommend_vr_guard = 1
# Confirmed independently by the XBL FDT and the UEFI memory table.
kernel_phys_load = 2818572288
# kernel_phys_offset (0x80000000) is left to runtime derivation: every validated
# run resolved it correctly, so it is omitted rather than asserted untested.
execution {
  recommended_cpus {
    main = 5
    consumer = 6
  }
  heap {
    # On this device a first page screen that needs a retry has never produced a
    # successful run (0/4), and continuing wedges the device until the watchdog
    # fires.  Bailing out after one attempt turns that into a clean userspace
    # failure that costs ~1.4s instead of a reboot.
    prepare_max_attempts = 1
  }
}
route {
  multicast_waiter {
    waiter_off = 96
    buffer_size = 264
    task_offset = 48
    lock_offset = 56
    compact_waiter = 1
    attempts = 128
    arm_sequence = 16
    arm_hold = 20000
  }
}
fallback {
  to = "none"
}
