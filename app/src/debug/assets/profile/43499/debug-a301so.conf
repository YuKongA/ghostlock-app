# =============================================================================
# DEBUG ONLY — GhostLock A301SO debug profile (self-contained, NO include)
#
# 用途：硬编码 debug 注入准备用的 A301SO 目标配置汇总（用户指令 2026-10-26）。
# 状态：**仅供 debug/注入准备**。配置「读取到数据源」的链路尚未接入，本文件
#       不参与任何解析/校验/分发；**不得**作为 supported profile，也不得用于
#       任何发布/能力宣称。
#
# 来源（逐段对应现有 profile 及其唯一 include）：
#   release / schema_version / kernel_major / recommend_shizuku /
#   kernel_phys_load / kernel_phys_offset / route / offset
#       ← app/src/main/assets/profile/43499/
#         5.15.189-android13-8-00016-g51bba4309aac-ab14546557.conf
#   task_struct / cred / kernelsnitch
#       ← app/src/main/assets/profile/common/abi/
#         5.15.189-android13-8-00016-g51bba4309aac-ab14546557.conf
#         （该 ABI 文件头：共享内核 ABI（task_struct / cred / kernelsnitch））
#
# 说明：A301SO = Xperia 1 V（QV770MFGJ1），5.15 内核；原 profile 只 include
#       上述 5.15.189 ABI 文件。common/kernelsnitch-6x.conf 与
#       common/credential-6x.conf 属 6.x 模板，未被该 profile 引用，故本 debug
#       文件**不采用**其值；kernelsnitch 保持 ABI 实测值（collisions=8,
#       mm_struct_sz=1024），cred 保持 5.15 ABI 的 ref 槽位布局。
# =============================================================================

release = "5.15.189-android13-8-00016-g51bba4309aac-ab14546557"
schema_version = 1
kernel_major = 5
recommend_shizuku = 1
kernel_phys_load = null
kernel_phys_offset = null

route = [
  { multicast_waiter {
    waiter_off = 96
    buffer_size = 264
    task_offset = 48
    lock_offset = 56
    compact_waiter = 1
  } }
]

