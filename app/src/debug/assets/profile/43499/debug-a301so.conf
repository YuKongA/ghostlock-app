  selinux_enforcing = 47885704
  selinux_blob_sizes = 35027656
  security_hook_heads = 35018304
  slide_nfulnl_logger = 45096488
  slide_boot_id = 47999001
  slide_loggers_0_1 = 45096280
}

task_struct {
  prio = 124
  normal_prio = 132
  sched_task_group = 1024
  pi_lock = 2180
  pi_waiters = 2200
  pi_top_task = 2216
  pi_blocked_on = 2224
  pid = 1496
  tgid = 1500
  atomic_flags = 1432
  real_cred = 1936
  cred = 1944
  comm = 1960
