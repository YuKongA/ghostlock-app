# GhostLock CVE-2026-98260 debug 参数 profile（B2；debug-only，release 不打包）
#
# 目标：OnePlus PLZ110（SM8850/canoe）Android 17，
#       kernel 6.12.69-android16-6-g242e1a07f878-ab15865446-4k
# 来源：YuKongA/CVE-2026-98260 @ ad1f4e7 的 timer/timer.c 常量（kallsyms/BTF/disasm）。
# 状态：**unverified 候选** —— 未过真机门禁（G8–G13 pending），不得作为 supported 依据。
# 权威：字段名/顺序/类型以 app/src/main/cpp/gl98260/params.h 为准（本文件只给值）。
release = "6.12.69-android16-6-g242e1a07f878-ab15865446-4k"
kernel_major = 6

# 页/slab：posix_timers_cache 为 order-1（8 KiB）。
page_size = 4096
cpu = 2
slab_order = 1
sockbuf = 8192

# KASLR/线性映射窗口。
slide_max = "0x40000000"
base_min = "0xffffff8000000000"
base_max = "0xffffffc000000000"

static {
  # 参数 schema（= C GLK98260_PARAMS_SCHEMA）
  schema_version = 1
  # do_timer_create+0x94（PLZ110 6.12.69 GKI 链接期地址）
  timer_site = "0xffffffc0803718f4"
  timer_site_low21 = "0x1718f4"
  # copy_process 内 task_struct 分配 call_site 低 21 位
  copy_process_low21 = "0xe94a4"
}

sizes {
  timer_alloc = 0x100
  cred_req = 0xb8
  cred_alloc = 0xc0
  task_alloc_bytes = 0x1440
}

offsets {
  cred_uid = 0x8
  task_cred = 0x900
  selinux_blob = 0x8
}

symbols {
  selinux_state = "0xffffffc082888890"
  panic_on_warn = "0xffffffc0825dade0"
  root_user = "0xffffffc082602170"
  init_user_ns = "0xffffffc082601ef8"
  init_ucounts = "0xffffffc082603b08"
  init_groups = "0xffffffc082603638"
}

caps {
  # (1 << (CAP_LAST_CAP+1)) - 1；该内核 CAP_LAST_CAP=40
  fullcap = "0x1ffffffffff"
  selinux_sid_kernel = 1
}

ksu {
  manager_package = "me.weishu.kernelsu"
  kmi = "android16-6.12"
  late_load_args = [
    "late-load",
    "--kmi",
    "android16-6.12",
    "--allow-shell",
    "--package-name",
    "me.weishu.kernelsu"
  ]
  ksud_fallbacks = [
    "/data/local/tmp/ksud",
    "/data/adb/ksu/bin/ksud"
  ]
}
