# GhostLock execution tuning for the select_stack route (HOCON); include it
# only from profiles whose route (or fallback) is select_stack.
execution {
  routes {
    select_stack {
      enter_delay_us = 50000
      timeout_us = 200000
      consumer_max_calls = 1
      consumer_burst_calls = 1
    }
  }
}
