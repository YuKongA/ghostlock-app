plugins {
    id 'com.android.application'
}

def appName = 'GhostLock'
def appVersionName = '1.0'

def signingProps = new Properties()
def signingPropsFile = rootProject.file('local.properties')
if (signingPropsFile.isFile()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def keystorePath = System.getenv('KEYSTORE_PATH') ?: signingProps.getProperty('KEYSTORE_PATH')
def keystorePwd = System.getenv('KEYSTORE_PASS') ?: signingProps.getProperty('KEYSTORE_PASS')
def alias = System.getenv('KEY_ALIAS') ?: signingProps.getProperty('KEY_ALIAS')
def keyPwd = System.getenv('KEY_PASSWORD') ?: signingProps.getProperty('KEY_PASSWORD')

// Pull request builds cannot access signing secrets; always use the default debug signing.
def isPrBuild = System.getenv('GITHUB_EVENT_NAME') == 'pull_request' || (System.getenv('GITHUB_REF') ?: '').startsWith('refs/pull/')
def hasReleaseSigning = !isPrBuild && keystorePath && keystorePwd && alias && keyPwd

def gitVersionCode
try {
    def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, project.projectDir)
    proc.waitFor()
    gitVersionCode = proc.text.trim().toInteger()
} catch (Exception e) {
    println "warning: git rev-list failed (${e.message}); versionCode falls back to 1"
    gitVersionCode = 1
}

def supportedKernelsSrc = layout.buildDirectory.dir('generated/source/supportedKernels')
def sharedOffsetsHeader = rootProject.file('src/kernels/offsets.h')
def offsetFieldRe = /\.([A-Za-z0-9_]+)\s*=\s*(0[xX][0-9A-Fa-f]+|-?\d+)/

def parseOffsetValue = { String text ->
    if (text.length() > 2 && text.substring(0, 2).equalsIgnoreCase('0x')) {
        return Long.parseLong(text.substring(2), 16)
    }
    return Long.parseLong(text)
}

def formatOffsetValue = { long value ->
    value < 0 ? "${value}L" : "0x${Long.toHexString(value)}L"
}

def escapeJavaString = { String value ->
    value.replace('\\', '\\\\').replace('"', '\\"')
}

// STRUCT_OFFSETS_* macros from src/kernels/offsets.h, expanded into field maps.
def parseStructMacros = { String text ->
    def macros = [:]
    def lines = text.readLines()
    for (int i = 0; i < lines.size(); i++) {
        def m = lines[i] =~ /#define\s+(STRUCT_OFFSETS_[A-Za-z0-9_]+)\s*(.*)/
        if (!m.matches()) {
            continue
        }
        def name = m.group(1)
        def body = m.group(2)
        while (lines[i].trim().endsWith('\\')) {
            i++
            body += ' ' + lines[i]
        }
        def fields = [:]
        def fm = body =~ offsetFieldRe
        while (fm.find()) {
            fields[fm.group(1)] = parseOffsetValue(fm.group(2))
        }
        macros[name] = fields
    }
    macros
}

// Per-kernel OFFSETS_ENTRY bodies: macro reference plus explicit overrides.
def parseKernelEntries = { File header, macros ->
    def text = header.text
    def names = []
    def entries = [:]
    def matcher = text =~ /OFFSETS_ENTRY\(\s*"([^"]+)"/
    while (matcher.find()) {
        def release = matcher.group(1)
        def tail = text.substring(matcher.end())
        def endIdx = tail.indexOf('\n),')
        def body = endIdx >= 0 ? tail.substring(0, endIdx) : tail
        names << release
        def fields = [:]
        def macroMatch = body =~ /STRUCT_OFFSETS_[A-Za-z0-9_]+/
        if (macroMatch.find()) {
            def base = macros[macroMatch.group()]
            if (base != null) {
                fields.putAll(base)
            }
        }
        def fm = body =~ offsetFieldRe
        while (fm.find()) {
            fields[fm.group(1)] = parseOffsetValue(fm.group(2))
        }
        entries[release] = fields
    }
    [names: names, entries: entries]
}

tasks.register('generateSupportedKernels') {
    def offsets = fileTree(rootProject.projectDir) {
        include 'src/kernels/*/offsets.h'
    }
    def outFile = supportedKernelsSrc.map { it.file('com/ghostlock/app/SupportedKernels.java') }
    inputs.files(offsets)
    inputs.file(sharedOffsetsHeader)
    outputs.file(outFile)
    doLast {
        def macros = parseStructMacros(sharedOffsetsHeader.text)
        def allNames = []
        def builtins = [:]
        offsets.each { f ->
            def parsed = parseKernelEntries(f, macros)
            allNames.addAll(parsed.names)
            builtins.putAll(parsed.entries)
        }
        def names = allNames.unique()
        def sb = new StringBuilder()
        sb << "package com.ghostlock.app;\n\n"
        sb << "import java.util.Collections;\n"
        sb << "import java.util.HashMap;\n"
        sb << "import java.util.Map;\n\n"
        sb << "/** Generated from kernel offset headers; do not edit. */\n"
        sb << "public final class SupportedKernels {\n"
        sb << "    public static final String[] UNAMES = {\n"
        names.each { name ->
            sb << "        \"${escapeJavaString(name)}\",\n"
        }
        sb << "    };\n\n"
        sb << "    /** Built-in release -> field -> value (STRUCT_OFFSETS_* macros expanded). */\n"
        sb << "    public static final Map<String, Map<String, Long>> BUILTIN = builtin();\n\n"
        sb << "    private static Map<String, Map<String, Long>> builtin() {\n"
        sb << "        Map<String, Map<String, Long>> builtin = new HashMap<>();\n"
        builtins.each { release, fields ->
            sb << "        {\n"
            sb << "            Map<String, Long> e = new HashMap<>();\n"
            fields.each { key, value ->
                sb << "            e.put(\"${escapeJavaString(key)}\", ${formatOffsetValue(value)});\n"
            }
            sb << "            builtin.put(\"${escapeJavaString(release)}\", Collections.unmodifiableMap(e));\n"
            sb << "        }\n"
        }
        sb << "        return Collections.unmodifiableMap(builtin);\n"
        sb << "    }\n\n"
        sb << "    private SupportedKernels() {}\n"
        sb << "}\n"
        def file = outFile.get().asFile
        file.parentFile.mkdirs()
        file.text = sb.toString()
    }
}

android {
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePwd
                keyAlias alias
                keyPassword keyPwd
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    namespace = 'com.ghostlock.app'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.ghostlock.app"
        minSdk 35
        targetSdk 37
        versionCode gitVersionCode
        versionName appVersionName
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            java.srcDir(supportedKernelsSrc.get())
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    enableKotlin = false

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

tasks.named('preBuild') {
    dependsOn(rootProject.tasks.named('prepareGhostlockJniLibs'))
    dependsOn(rootProject.tasks.named('prepareGhostlockExtractJniLibs'))
    dependsOn(tasks.named('generateSupportedKernels'))
}

base {
    archivesName = "${appName}-v${appVersionName}(${gitVersionCode})"
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // local unit tests run against a mockable android.jar whose org.json
    // stubs throw; the real artifact shadows it on the test classpath
    testImplementation 'org.json:json:20240303'
}
