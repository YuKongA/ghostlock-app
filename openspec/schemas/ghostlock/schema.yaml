name: ghostlock
version: 1
description: OpenSpec owns design; Beads owns tasks; existing approval and evidence
  gates remain authoritative.
artifacts:
- id: proposal
  generates: proposal.md
  description: Why this change exists and its authorized boundary
  template: proposal.md
  requires: []
  instruction: State the real consumer, authorized scope and non-goals here. Preserve
    semantic identifiers and cite original Beads approval/evidence records. No duplicate
    task checklist.
- id: specs
  generates: specs/**/*.md
  description: Behavior contract deltas, only when a contract actually changes
  template: spec.md
  requires:
  - proposal
  instruction: Use observable requirements and replayable scenarios, not implementation
    details. A tracking-only migration or docs/tooling change without product contract
    changes declares skip_specs in change metadata; do not invent product requirements.
- id: design
  generates: design.md
  description: Complete technical design, exact scope and verification criteria
  template: design.md
  requires:
  - proposal
  instruction: Maintain the complete effective design in OpenSpec, using CDA only
    when appropriate. Reference shared OpenSpec contracts rather than duplicating
    them. Do not substitute links to old Markdown plans or Beads design fields for
    the actual body. Original approval/evidence stays in Beads; imported historical
    wording never grants new approval.
apply:
  requires:
  - proposal
  - specs
  - design
  tracks: null
  instruction: Read the change's Beads issue link and use the project bd command for
    tasks. OpenSpec ready/all_done only describes artifact availability; it grants
    no approval and proves no implementation or gate. Do not create tasks.md or Markdown
    progress checkboxes. Preserve original author self-check, independent review,
    approval scope and applicable gates.
