schema: ghostlock
context: |
  Write in Chinese; keep OpenSpec structural headings and SHALL/MUST keywords.
  Read AGENTS.md and docs/development/documentation-standards.md#planning-tool-authority by task.
  Preserve existing approved design anchors, semantic identifiers and device gates.
  CDA supports author design; ghostlock-author-self-check and independent ghostlock-design-critic keep their original roles.
  Beads owns tasks and evidence. Do not generate tasks.md or duplicate progress checkboxes.
operations:
  apply:
    guidance:
      - Use npm run --silent bd for tasks; artifact readiness does not grant approval or prove gates.
  archive:
    guidance:
      - Confirm the linked Beads work is closed with appropriate evidence and original gate requirements; never archive unfinished work from zero Markdown task count.
