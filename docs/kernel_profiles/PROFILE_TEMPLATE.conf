# ============================================================================
# GhostLock v3 profile 主模板（HOCON / GLKv3 schema 3）—— **HOCON 重构定稿形状**
# ----------------------------------------------------------------------------
# 用途：为新设备/新内核起一份 profile。**复制本文件 → 改 release → 按 manifest 填值**。
# 形状状态：**定稿（用户裁决 2026-10-05）**，实现落地中（native/App/extractor 三侧同批）。
#
# 权威：
#   · 字段全表（唯一权威，native 导出）: profile-manifest-v3.tsv
#       owner / path / wire / required / default / source / doc
#       （两份副本逐字节一致：app/src/test/resources/ 与 profile-core/src/main/resources/）
#   · 结构与流程说明: docs/kernel_profiles/PROFILE_SCHEMA.md（及 _ZH）
#   · wire 设计: docs/analysis/wire-transport-model.md
#   · 重新生成字段表: make -C src profile-manifest-v3
#
# 版本规则（不要新增版本号）：
#   · HOCON 的 schema_version 与 wire 的 schema 是**同一个数字 3**；
#   · **唯一迁移点**是 Kotlin LegacyProfileConverter（legacy 1/缺键 → 3 并记诊断；其它值拒绝）；
#   · native **只认 3**；v2 已删除；extractor **只产出 3**（`--format conf` 同批产出本形状）；
#   · `kernel_profiles-legacy/*.conf` 是 **v1 输入夹具**，**保留旧形状**，不要按本模板改。
#
# 值来源图例（对应 manifest 的 source 列）：
#   [profile]    由本文件手填（extractor 产物或人工测量）
#   [derived]    运行时派生，**不要手写**（例：kmi = major*1000+minor）
#   [convention] 有约定默认；省略即用默认
#   [literal:N]  固定默认 N；省略即 N
#   [null]       必须由测量/提取得到；未知时写 null（表示未配置，**不等于 0**）
#
# 结构（HOCON 重构后）：
#   根级标量：schema_version / release / kernel_major / kernel_minor / safe_mode
#   available { <backend> = [ 组合 token ] }     # 两级：先 backend，再 token
#   backend.<id> { … }                           # 每后端配置
#   countermeasure.* { … }                       # 原生对策参数
#
# **已删除（出现即拒，fail-closed）**：
#   · `common` owner（其键上提为根级标量或删除）
#   · `platform` owner（`platform.abi.*` → `backend.cve_2026_43499.abi.*`）
#   · `selection { backend, terminal }`（改 `available{}`；**terminal 概念从 HOCON 移除**）
#   · 43284 的 `kmi` / `lkm_path` / `carrier_path`（**wire 字段保留**，**运行时现算注入**）
#   · `plugin` / `payload`：**按用户指令字面注释**（native owner 名单已注释，出现即拒），
#     代码与测试保留；**恢复＝撤销注释 + 跑门禁**（见 branch-plan 的恢复清单）。
# ============================================================================

ghostlock {
  # ---- 根级标量（与 wire 对齐；只有下列键允许出现在根）----
  schema_version = 3                      # 必填，恒为 3
  release        = "<uname -r 的精确输出>"  # 必填；内核按此**精确匹配**，不匹配即拒绝运行
  kernel_major   = null                   # [null] 内核主版本（以后有用，先留着）
  kernel_minor   = null                   # [null] 内核次版本（重构新增；与 major 一起供将来使用）
  safe_mode      = false                  # [literal:false] 安全模式（禁用所有模块）

  # ---- 可用项（两级：先选可用 backend，再在其下选组合 token）----
  # 语义：**profile 只声明可用项**；**运行时的选择权在用户/App**——
  #       App 从「available ∩ native catalog 可用」中让用户选，写入 wire 的 `backend.<id>.steps`。
  # 词表权威：`contract::kCombinationCatalog`（12 token = 7 可用 + 5 计划）。
  available {
    cve_2026_43499 = [ "mcast_rootchild", "pselect_rootchild" ]
    cve_2026_43284 = [ "umh" ]
  }

  # ---- 每个 CVE 后端（backend.<id>）----
  backend {
    cve_2026_43499 {
      steps = "mcast_rootchild"           # [profile] 组合 token；运行时由 App 选择后写入 wire

      # `platform.abi.*` 迁到这里（HOCON 重构：platform owner 删除）
      abi {
        task_struct {                     # 结构体字段偏移
          prio = null
          normal_prio = null
          sched_task_group = null
          pi_lock = null
          pi_waiters = null
          pi_top_task = null
          pi_blocked_on = null
          pid = null
          tgid = null
          atomic_flags = null
          real_cred = null
          cred = null
          comm = null
          tasks = null
          seccomp = null
        }
        cred {                            # 凭据结构偏移
          caps_offset = null
          ref0_offset = null
          ref1_offset = null
          ref2_offset = null
          ref3_offset = null
          ref_count   = null
        }
        kernel { }                        # 内核镜像事实（见 manifest: backend.cve_2026_43499.abi.kernel.*）
        offset {                          # 常用内核符号/对象偏移
          init_task = null
          init_cred = null
          empty_zero_page = null
          root_task_group = null
          selinux_enforcing = null
          selinux_blob_sizes = null
          security_hook_heads = null
        }
      }

      route   { }                         # route 私有参数（仅共享代码会读的才进公共槽）
      cred    { copy_size = null; usage_value = null; caps_count = null; caps_value = null;
                ref0_image = null; ref1_image = null; ref2_image = null; ref3_image = null }
      kernel  { }                         # 见 manifest: backend.cve_2026_43499.kernel.*
      offset  { slide_nfulnl_logger = null; slide_boot_id = null; slide_loggers_0_1 = null }
      execution { }                       # 执行调参（advisory）
    }

    cve_2026_43284 {
      steps = "umh"                       # [profile] 选择轴留在顶层；43284 无 route 轴 ⇒ 裸 path 名

      execution {                         # HOCON 重构：这些执行调参收进 execution.*
        late_load_args          = 0        # [literal:0] late-load 参数策略位掩码（bit0=package-name / bit1=ro-partitions / bit2=soft-reboot）
        selinux_exec_context    = 0        # [literal:0] 0=vendor_modprobe / 1=init / 2=custom
        module_poll_attempts    = 40       # [literal:40] LKM 窗口握手重试次数
        module_poll_interval_ms = 5        # [literal:5] 握手重试间隔（ms）
        wait_timeout_ms         = 15000    # [literal:15000] 链终点等待预算（ms）
      }

      # **不要再写 `kmi` / `lkm_path` / `carrier_path`**：
      #   · `kmi` = release 派生（major*1000+minor；写错曾致 KmiFieldMismatch）；
      #   · `lkm_path` / `carrier_path` / 各 `.ko` 路径：**统一在 GhostLock 内部目录解析**，
      #     **运行时现算并注入 wire**（wire 字段保留，配置文件里没有它们）。
    }
  }

  # ---- 原生对策参数（countermeasure）—— **owner 正在移除** ----
  # 用户裁决 2026-10-05（(b) 面）：`common.vr_guard` 与 `countermeasure.vivo_vr_guard.tracepoint_funcs`
  #   连同其 **wire 行与 manifest 行**一起删除（**已完成 `b55708a8`**）⇒ `countermeasure` owner 变空
  #   ⇒ **出现即拒**（(b) 已完成 `b55708a8`：`countermeasure` owner 已移除）；`defex` 已完成删除（`a68e2d5a`）；
  #   `platform/vivo/**` 代码与 `steps.cpp` 两处调用**已按 (a) 期删除**（8 文件 + 测试 + stub；`steps.cpp` −95 行；
  #   **已完成 = `4a182217`**、**真机门禁 PASS 已归档**（`device-gates/vrguard-a-20261006/`）；非行为差异：`w2b` stage 轨迹少一项）。本模板不再有 countermeasure 段。
}
}

# ============================================================================
# 验证配方（提交前至少跑前三项）
#   1) 字段表对拍（跨端一致性）: make -C src native-host-tests      # profile_manifest_v3_test 裸跑断言两份副本一致
#   2) App 侧门禁:               ./gradlew :profile-core:test :app:testDebugUnitTest
#   3) native 直接加载自检:      GHOSTLOCK_HOME=<dir> ./ghostlock --load-prebuilt-profile <doc.bin>
#      （注意：`--ghostlock-app-call` 的 stdin 必须是 [4B len][GLKv3 文档][会话帧]，缺帧只报 cannot load profile）
#   4) 真机门禁（攻击路径改动必须）: 冷启 + 试验台 + 归档 docs/analysis/device-gates/
#
# 常见 fail-closed 触发点（写错就整份被拒，不会静默降级）:
#   · 出现已删除的 owner：`common` / `platform` / `selection`（以及当前注释中的 `plugin` / `payload`）
#   · 根级出现白名单外的标量；未知顶层 owner（例如 plugins / payloads / root）
#   · `available` 的值不是「catalog 里真实存在的 token」；token 与 `steps` 不一致
#   · schema_version ≠ 3；根不是 map
#   · `plugin` 段出现 enabled=false（恢复注释后才适用）；module_path 绝对路径或含 ..；hash 非 64 位小写 hex
#   · `payload` 段缺 tier / 单档互斥违反 / ko.count 与实到不符 / 重复索引（恢复注释后才适用）
#   · 路径含 ..、反斜杠、控制字符或长度 >256 B；sha256 大写或非 hex
#   · 手写 `kmi`（43284）：键已删除，**出现即拒**（不再有 KmiFieldMismatch 这一步）
# ============================================================================
